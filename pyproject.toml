[project]
name = "cadtopo"
version = "0.1.0"
description = "Cost-aware dynamic-topology multi-agent LLM orchestration (DyTopo-based)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "instructor>=1.6",
    "litellm>=1.88.1",
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
    "tenacity>=9.1.4",
    "sentence-transformers>=5.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadtopo"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
